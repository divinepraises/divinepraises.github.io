
name: Deploy production and staging

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout production
        uses: actions/checkout@v6
        with:
          ref: main
          path: production

      - name: Checkout staging
        uses: actions/checkout@v6
        with:
          ref: staging
          path: staging

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Combine websites
        run: |
          mkdir -p _site/staging

          rsync -a --exclude='.git' --exclude='.github' \
            production/ _site/

          rsync -a --exclude='.git' --exclude='.github' \
            staging/ _site/staging/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            artifact_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages") | .id')

            if [ -n "$artifact_id" ]; then
              echo "Found github-pages artifact: $artifact_id"
              exit 0
            fi

            echo "Artifact not visible yet. Attempt $attempt/12. Waiting 5 seconds..."
            sleep 5
          done

          echo "::error::Artifact was not found after 60 seconds."
          exit 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
